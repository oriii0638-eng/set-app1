services:
  - type: web
    name: set-app
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    disk:
      name: set-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_FILE
        value: /var/data/db.json
      - key: COACH_KEY
        sync: false
